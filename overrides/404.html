{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <h1 style="font-size: 4rem; margin-bottom: 0.5rem; color: var(--sub-teal, #00C2A8);">404</h1>
  <p style="font-size: 1.2rem; margin-bottom: 2rem; color: var(--md-default-fg-color--light);">
    Page not found
  </p>
  <p style="margin-bottom: 2rem;">
    The page you're looking for doesn't exist or has been moved.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
    <a href="{{ config.site_url }}" class="md-button md-button--primary">
      Go to Homepage
    </a>
    <a href="{{ config.site_url }}getting-started/what-is-subscrypts/" class="md-button">
      What is Subscrypts?
    </a>
    <a href="{{ config.site_url }}resources/faq/" class="md-button">
      FAQ
    </a>

</div>
{% endblock %}
