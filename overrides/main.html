{% extends "base.html" %}

{% block announce %}
  <strong>Subscrypts</strong> is live on Arbitrum One &mdash;
  <a href="https://app.subscrypts.com/#/swap" target="_blank" rel="noopener">
    Swap SUBS tokens here
  </a>
{% endblock %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- SEO meta -->
  <meta name="author" content="Subscrypts">
  <meta property="og:site_name" content="Subscrypts Docs">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@Subscrypts_com">

  <!-- JSON-LD: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Subscrypts",
    "url": "https://subscrypts.com",
    "logo": "https://files.subscrypts.com/root/logoOpenGraph.webp",
    "description": "Decentralized subscription management protocol on Arbitrum One. Automates recurring crypto payments using the SUBS utility token with a 1% platform fee.",
    "foundingLocation": {
      "@type": "Place",
      "address": { "@type": "PostalAddress", "addressCountry": "NL" }
    },
    "sameAs": [
      "https://x.com/Subscrypts_com",
      "https://discord.gg/5nT5HcxMEg",
      "https://app.subscrypts.com",
      "https://discord.onsubscrypts.com",
      "https://github.com/Subscrypts",
      "https://docs.subscrypts.com"
    ]
  }
  </script>

  <!-- JSON-LD: WebSite with SearchAction -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Subscrypts Docs",
    "url": "https://docs.subscrypts.com/",
    "description": "Complete documentation for the Subscrypts ecosystem — blockchain-powered subscription management on Arbitrum One.",
    "publisher": {
      "@type": "Organization",
      "name": "Subscrypts",
      "url": "https://subscrypts.com"
    }
  }
  </script>

  <!-- JSON-LD: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Subscrypts",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Web (Arbitrum One blockchain)",
    "description": "Blockchain-based subscription management protocol that automates recurring payments using the SUBS ERC-20 token on Arbitrum One. 1% platform fee, no personal data required, MiCAR-compliant.",
    "url": "https://app.subscrypts.com",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD",
      "description": "Free to use. 1% protocol fee per subscription payment."
    },
    "publisher": {
      "@type": "Organization",
      "name": "Subscrypts"
    }
  }
  </script>
{% endblock %}
